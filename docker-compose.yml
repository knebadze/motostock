# Docker's default json-file log driver never rotates, so container logs
# grow until the disk fills. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runner
    restart: unless-stopped
    logging: *default-logging
    env_file: ./backend/.env
    # Caps a runaway process (e.g. a huge image decode) so it gets OOM-killed
    # and restarted on its own instead of starving Postgres and the frontend
    # on the same VPS. Adjust to the VPS's RAM.
    mem_limit: 1g
    environment:
      # Overrides whatever DATABASE_URL is sitting in backend/.env — inside
      # the compose network the DB is always reachable at host "db", never
      # localhost. Keep backend/.env's own DATABASE_URL for running the
      # backend outside Docker (e.g. local dev) without editing it back and
      # forth.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      # No curl/wget in the slim runner image — Node's own http client avoids
      # adding one just for this. Hits the app's existing GET /api/health,
      # which also pings the database (503 when it's unreachable — see app.ts),
      # so an outage shows up as `unhealthy` in `docker compose ps`.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:4000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-off — not part of the normal `up`, run explicitly after each deploy
  # that adds migrations: `docker compose run --rm migrate`. Reuses the
  # `builder` stage (has the prisma CLI + full source) instead of shipping
  # a separate image just for this. Also doubles as the seed runner
  # (`docker compose run --rm migrate npx prisma db seed`) — mounts the same
  # backend_uploads volume as the backend service so seed-processed images
  # (category/hero-slide/team photos) land in the persistent volume instead
  # of the throwaway container filesystem.
  migrate:
    build:
      context: ./backend
      target: builder
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    command: ["npx", "prisma", "migrate", "deploy"]
    # Same unprivileged user as the backend — the seed writes images into the
    # shared backend_uploads volume, and root-owned folders there would block
    # the backend (running as node) from writing into them later.
    user: node
    logging: *default-logging
    profiles: ["tools"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        # Optional — leave unset in .env until a GA4 property exists; see
        # frontend/Dockerfile's matching ARG comment.
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID}
        # Optional — Sentry (see frontend/Dockerfile and .env.example).
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Next's standalone server.js only binds every interface when HOSTNAME
      # is explicitly set — left unset, it binds to a single resolution of
      # "localhost" (whichever of ::1/127.0.0.1 it picks), which can differ
      # from what a separate client's own "localhost" DNS lookup resolves to.
      # That mismatch is exactly what makes the container's own healthcheck
      # below (and Caddy's reverse_proxy) see ECONNREFUSED even though the
      # server logs "Ready".
      HOSTNAME: "0.0.0.0"
      # Server-side (SSR) API calls go straight to the backend container over
      # the compose network instead of out through the public URL and back in
      # via Caddy — see frontend/src/lib/api/internal.ts. Runtime-only (not a
      # build arg): it's never exposed to the browser. The browser keeps using
      # NEXT_PUBLIC_API_URL.
      INTERNAL_API_URL: http://backend:4000/api
    # See the backend's mem_limit comment.
    mem_limit: 768m
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Read by the Caddyfile — unset = test phase (plain HTTP on :80 by IP);
      # "motostock22.ge" = production with automatic HTTPS. See DEPLOY.md.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      # HSTS rollout step (seconds) — 0 = off. See Caddyfile.
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  pgdata:
  backend_uploads:
  caddy_data:
  caddy_config:
